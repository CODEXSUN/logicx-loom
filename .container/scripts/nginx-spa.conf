server {
  listen 80;
  server_name log.logicx.in;
  root /usr/share/nginx/html;
  index index.html;

  add_header Referrer-Policy "strict-origin-when-cross-origin" always;
  add_header X-Content-Type-Options "nosniff" always;
  add_header X-Frame-Options "SAMEORIGIN" always;

  location = /health {
    access_log off;
    default_type text/plain;
    return 200 "ok\n";
  }

  location = /storage/mobile/release/update.json {
    add_header Cache-Control "no-store";
    try_files $uri =404;
  }

  location = /storage/mobile/release/logicx-loom.apk {
    default_type application/vnd.android.package-archive;
    add_header Cache-Control "public, max-age=3600";
    try_files $uri =404;
  }

  location = /api/platform {
    proxy_pass http://${LOGICX_LOOM_API_CONTAINER_NAME}:${LOGICX_LOOM_API_INTERNAL_PORT}/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  location = /loomdata {
    proxy_pass http://${LOGICX_LOOM_API_CONTAINER_NAME}:${LOGICX_LOOM_API_INTERNAL_PORT}/loomdata;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  location = /api/platform/ws/messaging {
    proxy_pass http://${LOGICX_LOOM_API_CONTAINER_NAME}:${LOGICX_LOOM_API_INTERNAL_PORT}/ws/messaging;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 3600s;
    proxy_send_timeout 3600s;
  }

  location ^~ /api/platform/ {
    rewrite ^/api/platform/(.*)$ /$1 break;
    proxy_pass http://${LOGICX_LOOM_API_CONTAINER_NAME}:${LOGICX_LOOM_API_INTERNAL_PORT};
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  location / {
    try_files $uri $uri/ /index.html;
  }

  location ~* \.(?:css|js|mjs|png|jpg|jpeg|gif|svg|ico|webp|woff|woff2)$ {
    expires 7d;
    add_header Cache-Control "public, immutable";
    try_files $uri =404;
  }
}
